name: Build Windows portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false
      - name: Prepare embedded files
        run: python tools/build_release.py --resources-only
      - name: Test launcher file and configuration logic
        run: go test ./gui
      - name: Install test dependencies
        run: python -m pip install numpy scipy
      - name: Run backend regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app
        run: python -m unittest discover -s tests -v
      - name: Build native GUI and portable package
        shell: pwsh
        run: ./tools/build-release.ps1
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Upload portable files
        uses: actions/upload-artifact@v7
        with:
          name: joyvox-${{ steps.version.outputs.value }}-windows-x64
          path: |
            release/joyvox-*-windows-x64-portable.zip
            release/SHA256SUMS.txt
            release/source-manifest.json
          if-no-files-found: error
          retention-days: 30
