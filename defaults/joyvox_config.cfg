# JoyVox 4.2.4
# joyvox.exe edits these settings. Stop recognition before changing them.
# Paths may be relative to this configuration file.

# KEYBINDS
# Hold to record; release to transcribe.
STT_LISTEN=mouse4
# Select public/team mode for the NEXT utterance.
STT_KEY_AUTO=f5
STT_TEAMKEY_AUTO=f6
# Manually send/repeat the prepared text in the game.
STT_KEY=j
STT_TEAMKEY=k

# GAME FILES
STT_KINGPIN_EXE=
STT_OUTPUT_PATH=
STT_OUTPUT_FILE=joyvoxinput.cfg
STT_EXEC_FILE=joyvox.cfg
STT_DICTIONARY_FILE=joyvox_dictionary.cfg

# RECOGNITION
# auto = large-v3-turbo on CUDA; small.en on CPU.
# Other choices: base.en (smaller/faster load), small.en, medium.en, large-v3.
# Models download once, then load directly from the local Hugging Face cache.
STT_WHISPER_MODEL=auto
STT_CPU_MODEL=small.en
# auto reports GPU failures and falls back to CPU; cuda fails instead of falling back.
STT_WHISPER_DEVICE=auto
# auto = float16 on supported GPUs / int8 on CPU.
# Set int8_float16 to reduce GPU memory use if running other GPU-heavy apps.
STT_WHISPER_COMPUTE_TYPE=auto
STT_LANGUAGE=en
STT_BEAM_SIZE=5
STT_PROMPT=Push forward and cover me. Watch the stairs. I need health, armor, and ammo. Nice shot, good game. Quake II, Kingpin, deathmatch, capture the flag, Bagman, cash bag, safe, rocket launcher, railgun.
# Recognition vocabulary: add player names/game terms, separated by commas.
# Correct spellings from your dictionary are added automatically as hints too.
STT_HOTWORDS=Kingpin, Bagman, cash bag, safe, team
# Silero speech detection helps avoid guessing text from silence/noise.
STT_VAD_FILTER=yes
# Minimum time the button was held, excluding pre-roll/tail. Allows short replies.
STT_MIN_AUDIO_LENGTH=0.15
STT_CPU_THREADS=4
# The GPU always runs a brief inference check before READY; no skips CPU warmup.
STT_MODEL_WARMUP=yes
# Model downloads are kept beside the portable app by default.
STT_MODEL_CACHE=.joyvox/models
# Optional CUDA/cuDNN DLL folders, separated by semicolons. Usually leave blank;
# The Install dependencies button can install the NVIDIA runtime libraries.
STT_CUDA_DLL_PATH=

# MICROPHONE
# auto uses the default input. The GUI also accepts name:Microphone name or a PortAudio index.
STT_AUDIO_INPUT_INDEX=auto
# The mic stays open. Only this small idle buffer is retained in RAM.
STT_PRE_ROLL_MS=150
# Finish capturing this much audio after release to preserve final consonants.
STT_TAIL_MS=120
STT_MAX_RECORD_SECONDS=30
# Maximum waiting utterances while the one recognition worker is busy.
STT_QUEUE_SIZE=3

# TEXT AND DELIVERY
STT_SENTENCECASE=no
STT_CAPITALIZE=no
STT_ENDWITHPERIOD=no
STT_ALLOWEXCLAMATION=no
# Transliterate English/Latin text for the original game's console font.
STT_ASCII_ONLY=yes
STT_AUTO_KEY=yes
STT_CLEAR_AFTER_SEND=yes
STT_CLEAR_DELAY=1.0
# Automatic key presses occur only with the selected game focused; otherwise text stays
# prepared for manual J/K. Add your executable name for a custom engine build.
STT_REQUIRE_GAME_FOCUS=yes
STT_GAME_EXES=kingpin.exe,kingpinx.exe,kingpin2.exe,kingpin_x64.exe

# SOUND EFFECTS
SFX_ENABLED=yes
SFX_MIC_ONOFF=yes
SFX_TRANSCRIBE_SUCCESS=yes
SFX_TRANSCRIBE_FAIL=yes

# OPTIONAL RECOGNITION DIAGNOSTICS
# yes saves ONLY the latest PTT clip/result for checking errors. Idle mic audio
# is never saved. Leave no for normal use. Files are overwritten each utterance.
STT_SAVE_RECORDINGS=no
STT_RECORDINGS_PATH=recordings
